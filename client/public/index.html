<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>muve — Get there</title>
  <meta name="description" content="Scroll to fly through the world of muve — a real-time ride-hailing platform built for Nigeria. From request to arrival, one continuous flight." />
  <meta name="theme-color" content="#F4F1EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="muve" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='black'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-weight='bold'>m</text></svg>" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/app/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Theme the engine — matches the generated scenes' background + Muve brand kit */
    :root, .sw-root {
      --sw-bg: #F4F1EC;            /* == the scene background colour (cream) */
      --sw-ink: #1A1A1F;           /* charcoal — primary text */
      --sw-ink-soft: #6B6B6B;      /* secondary text */
      --sw-accent: #0E8345;        /* signal green — default accent */
      --sw-font-display: "Inter", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
      --sw-font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      --sw-font-mono: "JetBrains Mono", ui-monospace, Menlo, "Cascadia Code", "Courier New", monospace;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'muve', href: '#top' },
      cta: { label: 'Ride now', href: '/app' },
      hint: 'scroll to explore',
      scroll: 1.4,
      crossfade: 0.18,

      sections: [
        {
          id: 'city', label: 'Lagos',
          still: 'assets/01-city.webp',
          stillMobile: 'assets/01-city-m.webp',
          accent: '#FFB84D',
          scroll: 1.6, linger: 0.4,
          eyebrow: 'A city in motion',
          title: 'Every Lagos street is a journey.',
          body: 'From the first light of dawn over the lagoon to the last danfo bus rolling home — this is a city that never stops moving.',
          tags: ['Real-time', 'Live GPS', 'Road-routing'],
        },
        {
          id: 'streets', label: 'Streets',
          still: 'assets/02-streets.webp',
          stillMobile: 'assets/02-streets-m.webp',
          accent: '#FFB84D',
          scroll: 1.3, linger: 0.3,
          eyebrow: 'Where you are',
          title: 'From your doorstep to anywhere.',
          body: 'Markets, offices, homes, and hotspots — every corner of Lagos is within reach. Your pickup is just a tap away.',
          tags: ['Lagos-wide', 'Every borough', 'Door-to-door'],
        },
        {
          id: 'request', label: 'Request',
          still: 'assets/03-request.webp',
          stillMobile: 'assets/03-request-m.webp',
          accent: '#0E8345',
          scroll: 1.3, linger: 0.35,
          eyebrow: 'Tap. Where to?',
          title: 'It starts with a pin.',
          body: 'Set your pickup, drop a destination, and the city starts listening. One tap is all it takes.',
          tags: ['Address search', 'Tap-to-set', 'Instant estimate'],
        },
        {
          id: 'match', label: 'Match',
          still: 'assets/04-match.webp',
          stillMobile: 'assets/04-match-m.webp',
          accent: '#0E8345',
          scroll: 1.3, linger: 0.35,
          eyebrow: 'Behind the scenes',
          title: 'The network finds your driver.',
          body: 'The matching engine offers your ride to the nearest driver, cascading through the fleet until someone accepts.',
          tags: ['Nearest-driver', '30s accept timer', 'WebSocket live'],
        },
        {
          id: 'driver', label: 'Driver',
          still: 'assets/05-driver.webp',
          stillMobile: 'assets/05-driver-m.webp',
          accent: '#FFB84D',
          scroll: 1.3, linger: 0.35,
          eyebrow: 'Supply meets demand',
          title: 'Your driver is on the way.',
          body: 'A notification, a door opens, headlights flick on. Trusted, verified drivers on real Lagos roads — GPS streaming to your map every second.',
          tags: ['1Hz GPS stream', 'KYC verified', 'Ratings & tips'],
        },
        {
          id: 'ride', label: 'The Ride',
          still: 'assets/06-ride.webp',
          stillMobile: 'assets/06-ride-m.webp',
          accent: '#C5564A',
          scroll: 1.4, linger: 0.4,
          eyebrow: 'Three ways to get there',
          title: 'MuveX. XL. Black.',
          body: 'Affordable everyday rides, extra room for groups, or premium top drivers. Fares in Naira with live estimates and dynamic surge pricing.',
          tags: ['MuveX', 'MuveXL', 'Muve Black'],
        },
        {
          id: 'fare', label: 'Fare',
          still: 'assets/07-fare.webp',
          stillMobile: 'assets/07-fare-m.webp',
          accent: '#C5564A',
          scroll: 1.3, linger: 0.35,
          eyebrow: 'Fair fares, negotiated',
          title: 'Propose. Counter. Agree.',
          body: 'Don\'t like the suggested fare? Propose your own. Drivers can counter, riders can accept or decline — transparent negotiation built in.',
          tags: ['Fare negotiation', 'Naira pricing', 'No surprises'],
        },
        {
          id: 'arrival', label: 'Arrival',
          still: 'assets/08-arrival.webp',
          stillMobile: 'assets/08-arrival-m.webp',
          accent: '#0E8345',
          scroll: 1.4, linger: 0.4,
          eyebrow: 'You made it',
          title: 'Pull up. Step out. Rate.',
          body: 'Rate your driver, add a tip, and you\'re done. Every trip makes the network smarter and the fleet stronger.',
          tags: ['Ratings', 'Tips', 'Trip history'],
        },
        {
          id: 'earnings', label: 'Drivers',
          still: 'assets/09-earnings.webp',
          stillMobile: 'assets/09-earnings-m.webp',
          accent: '#FFB84D',
          scroll: 1.3, linger: 0.35,
          eyebrow: 'Built for drivers too',
          title: 'Track every naira.',
          body: 'Income and expenses in one dashboard. Fuel, repairs, maintenance — log it all and see your net earnings in real time.',
          tags: ['Expense tracking', 'Earnings dashboard', 'Net profit'],
        },
        {
          id: 'closing', label: 'muve',
          still: 'assets/10-closing.webp',
          stillMobile: 'assets/10-closing-m.webp',
          accent: '#0E8345',
          scroll: 1.6, linger: 0.45,
          eyebrow: 'Built for Nigeria',
          title: 'Get there. With muve.',
          body: 'A full-stack, real-time ride-hailing platform built for Nigeria — from Lagos to every corner of the nation.',
          tags: ['Full-stack', 'PWA installable', 'Open source'],
          cta: {
            primary: { label: 'Ride now', href: '/app' },
            secondary: { label: 'View on GitHub', href: 'https://github.com/webartistry3D/muve' },
          },
        },
      ],
    });

    // Inject About / Contact links into the engine's topbar (after the section nav, before CTA)
    (function() {
      var topbar = document.querySelector('.sw-topbar');
      if (!topbar) return;
      var links = document.createElement('div');
      links.className = 'sw-toplinks';
      links.innerHTML =
        '<a href="about.html" class="sw-toplinks__a">About</a>' +
        '<a href="contact.html" class="sw-toplinks__a">Contact</a>';
      // Insert after the section nav (sw-nav), before the CTA button
      var cta = topbar.querySelector('.sw-topcta');
      if (cta) topbar.insertBefore(links, cta);
      else topbar.appendChild(links);
    })();
  </script>
</body>
</html>
