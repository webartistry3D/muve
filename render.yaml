services:
  # Backend — API + WebSockets
  - type: web
    name: muve-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set to the frontend URL after deploying the frontend
      - key: MAPBOX_TOKEN
        sync: false  # Mapbox API token for Directions API
      - key: SIM_MODE
        value: "false"  # Disable simulated drivers in production

  # Frontend — landing page + React app
  - type: web
    name: muve
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to the backend URL after deploying the API
      - key: VITE_MAPBOX_TOKEN
        sync: false  # Mapbox token for map tiles + geocoding
